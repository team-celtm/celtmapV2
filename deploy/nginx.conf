# Example edge proxy for CELTM hosted deployments.
# Use provider-managed TLS certificates and redirect HTTP to HTTPS before this
# server block, or terminate TLS directly here.

limit_req_zone $binary_remote_addr zone=celtm_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=celtm_api:20m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    client_max_body_size 25m;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_connect_timeout 15s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/v1/admin/login {
        limit_req zone=celtm_login burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=celtm_api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /system/metrics {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
