version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: celtm/celtm-api:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/CELTMIND:/app/CELTMIND
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: celtm/celtm-api:latest
    command: celery -A main.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/CELTMIND:/app/CELTMIND
    depends_on:
      - redis

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: celtm/celtm-api:latest
    command: celery -A main.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: celtm/celtm-ui:latest
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - api

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  CELTMIND:
